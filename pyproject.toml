[project]
name = "document-insight-pipeline"
version = "0.1.0"
description = "Map-reduce LLM tool that turns a folder of business documents into a summary report."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
analyze-docs = "src.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.providers", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "expensive: tests that hit a real LLM provider (skip by default)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "input_docs", "examples"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = ["E501"]  # long lines: line-length already enforced; allow data-shaped exceptions

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"eval/fixtures/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src", "eval"]
exclude = ["^\\.venv/", "^build/", "^input_docs/", "^examples/"]

[[tool.mypy.overrides]]
module = ["yaml", "tenacity.*"]
ignore_missing_imports = true
