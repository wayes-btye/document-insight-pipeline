# Distractors — themes designed NOT to be surfaced as report items.
# Surfacing any of these as a theme, insight, risk, opportunity or
# action counts as a false positive in Tier 2.

distractors:
  - id: office_relocation
    canonical_name: "Office relocation and admin chatter"
    aliases:
      - "office relocation"
      - "office move"
      - "vine street"
      - "desk assignment"
      - "facilities"
      - "office lease"
      - "IT helpdesk"
    nature: noise
    actual_doc_count: 3
    expected_docs:
      - note_006.txt
      - note_031.txt
      - it_helpdesk_thread.txt
    description: |
      Admin chatter about office moves, lease, desk assignments,
      IT helpdesk tickets. Operationally real, strategically irrelevant.
      A tool that surfaces this as a "theme" or "risk" is over-eager
      on low-signal noise.

  - id: dismissed_consumer_pivot
    canonical_name: "Dismissed consumer pivot (negation handling test)"
    aliases:
      - "consumer pivot"
      - "pivot to consumer"
      - "consumer expansion"
      - "consumer market"
      - "consumer-side opportunity"
      - "B2C opportunity"
    nature: negation
    actual_doc_count: 3
    expected_docs:
      - note_008.txt
      - note_051.txt
      - note_060.txt
    description: |
      Consumer-side strategy mentioned across multiple docs only in the
      form of explicit dismissal: "we are not pivoting to consumer",
      "the partner asked about consumer; we declined", etc. Tests
      negation handling. Surfacing this as an opportunity, recommended
      action, or theme is a serious failure: the tool would be
      recommending the opposite of what the documents actually say.

# Pure noise files — no theme content at all.
# Tool should not cite these for any theme.
pure_noise:
  - re_resched.txt          # 17-word scheduling fragment
  - zoom_recording_notice.txt  # System notification

# Doc type distribution (committed corpus):
doc_type_breakdown:
  client_notes: 30
  meeting_summaries: 20
  interview_transcripts: 8
  research_snippets: 18
  market_commentary: 18
  edge_case_noise: 5
  total: 99
  # Note: file count is 101 (some noise files counted in noise category;
  # 2 docs cross-counted). Total file count via `ls input_docs/`: 101.

# File naming variety (verifies tool is glob-driven, not name-driven):
filename_conventions:
  numeric: "note_NNN.txt"            # ~85 of 101 files
  topical: "topic_word_brief.txt"    # ~10 of 101 files
  dated_topical: "interview_X_YYYYMMDD.txt"  # 8 interview transcripts
  realistic_noise: "re_resched.txt, it_helpdesk_thread.txt, zoom_recording_notice.txt"
