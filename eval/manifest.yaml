# Sealed corpus manifest: ground truth for Tier 2 evaluation.
#
# Populated after corpus generation. Once this file is locked, the
# extraction pipeline (src/) MUST NOT import it. The eval harness
# (eval/) does. This procedural separation is what lets the
# grading numbers mean anything.
#
# `actual_doc_count` reflects the substantive carriers of each theme
# in the committed corpus (not incidental mentions). `expected_docs`
# is the canonical list of files where each theme is substantively
# present and where citation precision will be measured against.
#
# A doc may carry multiple themes. A doc cited under one theme will
# only count toward citation precision for THAT theme.

